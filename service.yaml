apiVersion: v1
kind: Service

metadata:
  name: task-manager-service

spec:
  type: NodePort

  selector:
    app: task-manager

  ports:
    - name: 33351-frontend
      protocol: TCP
      port: 5173
      targetPort: 5173

    - name: 33351-backend
      protocol: TCP
      port: 5000
      targetPort: 5000

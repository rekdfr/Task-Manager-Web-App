apiVersion: apps/v1
kind: Deployment

metadata:
  name : 33351-taskmanager-deployment

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: task-manager

  template:
    metadata:
      labels:
        app: task-manager

    spec:
      containers:
        - name: 33351-backend
          image: 33351-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
        - name: 33351-frontend
          image: 33351-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173

